<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 565" width="100%" height="100%">
  <defs>
    <linearGradient id="rawGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f87171" />
    </linearGradient>
    <linearGradient id="optGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="850" height="565" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Title & Subtitle -->
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">
    🚀 Token Cost Optimizer (v1.1.0) - Benchmark Comparison
  </text>
  <text x="40" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">
    Deterministic local compression across Code, JSON, Logs, DOM HTML &amp; Browser XHS Sessions
  </text>

  <!-- Summary KPI Cards -->
  <g transform="translate(40, 95)">
    <!-- Card 1 -->
    <rect width="230" height="65" rx="10" fill="#1e293b" stroke="#334155" />
    <text x="15" y="24" font-family="sans-serif" font-size="11" fill="#94a3b8">TOTAL RAW TOKENS</text>
    <text x="15" y="48" font-family="sans-serif" font-size="20" font-weight="bold" fill="#f87171">2,705 Tokens</text>

    <!-- Card 2 -->
    <rect x="260" width="230" height="65" rx="10" fill="#1e293b" stroke="#334155" />
    <text x="275" y="24" font-family="sans-serif" font-size="11" fill="#94a3b8">OPTIMIZED TOKENS</text>
    <text x="275" y="48" font-family="sans-serif" font-size="20" font-weight="bold" fill="#34d399">1,346 Tokens</text>

    <!-- Card 3 -->
    <rect x="520" width="230" height="65" rx="10" fill="#1e293b" stroke="#334155" />
    <text x="535" y="24" font-family="sans-serif" font-size="11" fill="#94a3b8">OVERALL SAVINGS RATE</text>
    <text x="535" y="48" font-family="sans-serif" font-size="20" font-weight="bold" fill="#38bdf8">50.2% Saved</text>
  </g>

  <!-- Horizontal Comparison Bars -->
  <g transform="translate(40, 185)">

    <!-- Category: Python Code AST Pruning -->
    <text x="0" y="16" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Python Code AST Pruning</text>
    <text x="0" y="32" font-family="sans-serif" font-size="11" fill="#64748b">sample_code.py (84.6ms)</text>

    <!-- Raw Bar -->
    <rect x="220" y="0" width="420" height="18" rx="4" fill="url(#rawGrad)" />
    <text x="650" y="14" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fca5a5">856 Tok</text>

    <!-- Opt Bar -->
    <rect x="220" y="22" width="136" height="18" rx="4" fill="url(#optGrad)" />
    <text x="366" y="36" font-family="sans-serif" font-size="11" font-weight="bold" fill="#6ee7b7">278 Tok (-67.5%)</text>

    <!-- Category: Massive JSON Schema Fold -->
    <text x="0" y="81" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Massive JSON Schema Fold</text>
    <text x="0" y="97" font-family="sans-serif" font-size="11" fill="#64748b">sample_data.json (80.9ms)</text>

    <!-- Raw Bar -->
    <rect x="220" y="65" width="334" height="18" rx="4" fill="url(#rawGrad)" />
    <text x="564" y="79" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fca5a5">682 Tok</text>

    <!-- Opt Bar -->
    <rect x="220" y="87" width="88" height="18" rx="4" fill="url(#optGrad)" />
    <text x="318" y="101" font-family="sans-serif" font-size="11" font-weight="bold" fill="#6ee7b7">181 Tok (-73.5%)</text>

    <!-- Category: Terminal/Build Log Denoise -->
    <text x="0" y="146" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Terminal/Build Log Denoise</text>
    <text x="0" y="162" font-family="sans-serif" font-size="11" fill="#64748b">sample.log (89.3ms)</text>

    <!-- Raw Bar -->
    <rect x="220" y="130" width="196" height="18" rx="4" fill="url(#rawGrad)" />
    <text x="426" y="144" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fca5a5">400 Tok</text>

    <!-- Opt Bar -->
    <rect x="220" y="152" width="149" height="18" rx="4" fill="url(#optGrad)" />
    <text x="379" y="166" font-family="sans-serif" font-size="11" font-weight="bold" fill="#6ee7b7">305 Tok (-23.8%)</text>

    <!-- Category: Browser DOM Interactive Prune -->
    <text x="0" y="211" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Browser DOM Interactive Prune</text>
    <text x="0" y="227" font-family="sans-serif" font-size="11" fill="#64748b">sample_xhs_dom.html (122.1ms)</text>

    <!-- Raw Bar -->
    <rect x="220" y="195" width="271" height="18" rx="4" fill="url(#rawGrad)" />
    <text x="501" y="209" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fca5a5">553 Tok</text>

    <!-- Opt Bar -->
    <rect x="220" y="217" width="202" height="18" rx="4" fill="url(#optGrad)" />
    <text x="432" y="231" font-family="sans-serif" font-size="11" font-weight="bold" fill="#6ee7b7">412 Tok (-25.5%)</text>

    <!-- Category: Xiaohongshu API & Session Trim -->
    <text x="0" y="276" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Xiaohongshu API & Session Trim</text>
    <text x="0" y="292" font-family="sans-serif" font-size="11" fill="#64748b">sample_xhs_api.json (115.6ms)</text>

    <!-- Raw Bar -->
    <rect x="220" y="260" width="105" height="18" rx="4" fill="url(#rawGrad)" />
    <text x="335" y="274" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fca5a5">214 Tok</text>

    <!-- Opt Bar -->
    <rect x="220" y="282" width="83" height="18" rx="4" fill="url(#optGrad)" />
    <text x="313" y="296" font-family="sans-serif" font-size="11" font-weight="bold" fill="#6ee7b7">170 Tok (-20.6%)</text>

  </g>

  <!-- Legend -->
  <g transform="translate(40, 530)">
    <rect width="12" height="12" rx="3" fill="#ef4444" />
    <text x="18" y="10" font-family="sans-serif" font-size="11" fill="#94a3b8">Raw Context (Before)</text>

    <rect x="180" width="12" height="12" rx="3" fill="#10b981" />
    <text x="198" y="10" font-family="sans-serif" font-size="11" fill="#94a3b8">Optimized Context (After)</text>

    <text x="560" y="10" font-family="sans-serif" font-size="11" fill="#38bdf8">⚡ Pure Local Python Determinism</text>
  </g>
</svg>

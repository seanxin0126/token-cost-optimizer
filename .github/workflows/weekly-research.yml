name: 🔄 Weekly Token Optimization Research & Issue Dispatcher

on:
  schedule:
    # 每周一上午 09:00 (UTC 01:00) 自动触发
    - cron: '0 1 * * 1'
  workflow_dispatch: # 支持随时在 GitHub 网页上手动点击一键运行

permissions:
  contents: read
  issues: write

jobs:
  research-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔍 Run Research & Generate Weekly Report
        run: |
          python scripts/check_updates.py weekly_report.md

      - name: 📢 Dispatch GitHub Issue for Owner Confirmation
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('weekly_report.md', 'utf8');
            const now = new Date();
            const dateStr = now.toISOString().split('T')[0];
            
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[周度前沿优化提案] Token Cost Optimizer 演进报告 (${dateStr})`,
              body: body,
              labels: ['enhancement', 'weekly-report', 'automated']
            });
            console.log(`Created Issue: ${issue.data.html_url}`);
